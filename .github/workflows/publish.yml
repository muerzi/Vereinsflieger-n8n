name: Publish to npm

# Deliberately NOT triggered on every push - publishing is a manual,
# intentional action. Fire it either by publishing a GitHub Release, or by
# running this workflow manually from the Actions tab once you're ready.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm's OIDC-based "Trusted Publisher" flow - lets npm
      # verify this run without a long-lived NPM_TOKEN secret.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
